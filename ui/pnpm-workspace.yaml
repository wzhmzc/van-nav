# pnpm 11+：overrides / allowBuilds 只能写在本文件，package.json 的 "pnpm" 字段会被忽略
allowBuilds:
  core-js: true
  core-js-pure: true

overrides:
  # --- 既有（master 已落地；部分覆盖 CRA 传递依赖，保留以维持 lock 一致）---
  nth-check: ">=2.0.1"
  # 统一抬到安全线；禁止再钉 @6: 6.0.2（会压过本条，导致 #53/#97 残留）
  serialize-javascript: ">=7.0.5"
  underscore: ">=1.13.8"
  tmp: ">=0.2.6"
  webpack-dev-server: ">=5.2.4"
  uuid: ">=11.1.1"
  "@tootallnate/once": ">=2.0.1"
  postcss: ">=8.5.18"

  # --- Plan A 低风险必做（原 package.json pnpm.overrides，pnpm 11 已不读该字段）---
  form-data@3: 3.0.5
  form-data@4: 4.0.6
  launch-editor: 2.14.1
  brace-expansion@2: 2.1.2
  brace-expansion@5: 5.0.8
  js-yaml@3: 3.15.0
  js-yaml@4: 4.3.0
  fast-uri: 3.1.4
  shell-quote: 1.9.0
  websocket-driver: 0.7.5
  http-proxy-middleware@2: 2.0.10
  body-parser@1: 1.20.6
  serialize-javascript@7: 7.0.5
  svgo@2: 2.8.3

  # --- Plan B：补齐 CRA 传递依赖安全线（Dependabot open #134/#53/#97/#141）---
  brace-expansion@1: 1.1.16
  svgo@1: 2.8.3
